name: Update schedule data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check openpyxl python-docx requests

      - name: Download and convert the current schedule
        env:
          CLOUD_PUBLIC_URL: https://cloud.mail.ru/public/LQtu/LPPHQ7i4C
        run: python cloudflare/scripts/update_data.py

      - name: Commit changed schedule data
        run: |
          if git diff --quiet -- cloudflare/data/schedule.json; then
            echo "No changes"
            exit 0
          fi

          git config user.name "schedule-updater[bot]"
          git config user.email "schedule-updater[bot]@users.noreply.github.com"
          git add cloudflare/data/schedule.json
          git commit -m "chore: update schedule data"
          git push
